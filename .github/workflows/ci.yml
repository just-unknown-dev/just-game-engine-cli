name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      - run: dart pub get
      - run: dart analyze --fatal-infos
      # pub.dev takes points for unformatted code. (templates/ isn't Dart
      # until `just game init` fills it in.)
      - run: dart format --output=none --set-exit-if-changed lib bin test tool example
      - run: dart test
      # The bundled templates must be the files in templates/.
      - run: dart run tool/bundle_templates.dart && git diff --exit-code lib/src/game/bundled_templates.g.dart
        shell: bash
      - run: dart pub publish --dry-run
        if: matrix.os == 'ubuntu-latest'

  # The primary library's toolkit runs on the web: its tests in Chrome, as
  # JavaScript and as WebAssembly. (Test files that need dart:io are
  # @TestOn('vm') and skipped here.) The runner image has Chrome.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      - run: dart pub get
      - run: dart test -p chrome
      - run: dart test -p chrome -c dart2wasm

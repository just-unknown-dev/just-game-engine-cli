name: just_game_engine_cli
description: "The Just Game Engine's commands for `just` (just_core_cli): run and build games, check releases hold no editor, manage scenes and migrate saved files."
version: 0.2.0
homepage: https://github.com/just-unknown-dev/just-game-engine-cli
repository: https://github.com/just-unknown-dev/just-game-engine-cli
issue_tracker: https://github.com/just-unknown-dev/just-game-engine-cli/issues

topics:
  - cli
  - gamedev
  - game-engine
  - flutter

environment:
  sdk: ^3.11.0

# The Flutter every game is made with and kept on: just_core_cli reads it
# from here (pub.dev serves the pubspec as it is) before this package is
# fetched, and writes it into the game's just.json. GameSet.flutterPin
# holds the same version.
just:
  flutter: 3.47.9

dependencies:
  args: ^2.7.0
  dart_mcp: ^0.5.2
  just_core_cli: ^0.2.0
  just_game_engine_formats: ^0.3.0
  meta: ^1.15.0

dev_dependencies:
  lints: ^6.0.0
  stream_channel: ^2.1.4
  test: ^1.25.6
